<!DOCTYPE html>
<html>
<head>
    <title>Beer Flow Monitor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .tap-card { margin-bottom: 20px; }
        .keg-level { height: 30px; border-radius: 15px; }
        .empty { background-color: #f8d7da; }
        .calibrating { border: 3px solid #ffc107; }
        .pouring { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">🍺 Beer Flow Monitor</h1>
        
        <div class="row" id="tapsContainer"></div>
        
        <div class="modal fade" id="tapModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Tap Settings</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="tapForm">
                            <input type="hidden" id="tapIndex">
                            <div class="mb-3">
                                <label class="form-label">Tap Name</label>
                                <input type="text" class="form-control" id="tapName">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Beer Name</label>
                                <input type="text" class="form-control" id="beerName">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Pulses per Oz</label>
                                <input type="number" step="0.1" class="form-control" id="pulsesPerOz">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Keg Size (oz)</label>
                                <input type="number" step="0.1" class="form-control" id="kegSize" value="640">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" onclick="saveTap()">Save changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const tapModal = new bootstrap.Modal(document.getElementById('tapModal'));
        
        function updateUI() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('tapsContainer');
                    container.innerHTML = '';
                    
                    data.taps.forEach(tap => {
                        container.innerHTML += createTapCard(tap);
                    });
                });
        }
        
        function createTapCard(tap) {
            const percentage = tap.percentage.toFixed(1);
            const levelColor = tap.percentage > 50 ? 'bg-success' : 
                              tap.percentage > 20 ? 'bg-warning' : 'bg-danger';
            
            return `
                <div class="col-md-4">
                    <div class="card tap-card ${tap.calibrating ? 'calibrating' : ''}">
                        <div class="card-body">
                            <h5 class="card-title">${tap.name}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${tap.beer}</h6>
                            
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <span>Keg Level: ${tap.level.toFixed(1)} oz</span>
                                    <span>${percentage}%</span>
                                </div>
                                <div class="progress keg-level">
                                    <div class="progress-bar ${levelColor}" 
                                         style="width: ${percentage}%"></div>
                                </div>
                            </div>
                            
                            ${tap.isPouring ? 
                                `<div class="alert alert-info pouring">
                                    Pouring: ${tap.currentPour.toFixed(2)} oz
                                 </div>` : ''}
                            
                            <div class="btn-group w-100">
                                <button class="btn btn-sm btn-warning" 
                                        onclick="startCalibration(${tap.index})">
                                    Calibrate
                                </button>
                                <button class="btn btn-sm btn-danger" 
                                        onclick="resetKeg(${tap.index})">
                                    Reset Keg
                                </button>
                                <button class="btn btn-sm btn-primary" 
                                        onclick="editTap(${tap.index})">
                                    Settings
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function resetKeg(index) {
            if (confirm('Reset keg level to full?')) {
                fetch('/api/reset', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `index=${index}`
                }).then(() => updateUI());
            }
        }
        
        function startCalibration(index) {
            fetch('/api/calibrate/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `index=${index}`
            }).then(() => {
                const ounces = prompt('Enter known ounces poured:');
                if (ounces) {
                    fetch('/api/calibrate/end', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: `index=${index}&ounces=${ounces}`
                    }).then(() => updateUI());
                }
            });
        }
        
        function editTap(index) {
            fetch(`/api/tap?index=${index}`)
                .then(response => response.json())
                .then(tap => {
                    document.getElementById('tapIndex').value = tap.index;
                    document.getElementById('tapName').value = tap.name;
                    document.getElementById('beerName').value = tap.beer;
                    document.getElementById('pulsesPerOz').value = tap.pulsesPerOz;
                    document.getElementById('kegSize').value = tap.capacity;
                    tapModal.show();
                });
        }
        
        function saveTap() {
            const data = {
                index: parseInt(document.getElementById('tapIndex').value),
                tapName: document.getElementById('tapName').value,
                beerName: document.getElementById('beerName').value,
                pulsesPerOz: parseFloat(document.getElementById('pulsesPerOz').value),
                kegSize: parseFloat(document.getElementById('kegSize').value)
            };
            
            fetch('/api/tap/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => {
                tapModal.hide();
                updateUI();
            });
        }
        
        // Update every 2 seconds
        setInterval(updateUI, 2000);
        updateUI();
    </script>
</body>
</html>
